<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>台股追蹤小幫手</title>
    <link rel="manifest" href="./manifest.json">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #121212; color: #ffffff; padding: 20px; margin: 0; }
        h1 { font-size: 24px; color: #4CAF50; }
        .card { background: #1e1e1e; padding: 15px; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        input, button { padding: 10px; margin: 5px 0; border-radius: 5px; border: none; width: calc(100% - 20px); font-size: 16px; }
        button { background-color: #4CAF50; color: white; font-weight: bold; cursor: pointer; width: 100%; }
        button:active { background-color: #45a049; }
        .stock-item { display: flex; justify-content: space-between; border-bottom: 1px solid #333; padding: 10px 0; }
        .alert-text { font-size: 12px; color: #ff9800; }
    </style>
</head>
<body>

    <h1>📈 台股追蹤小幫手</h1>

    <div class="card">
        <h3>🔍 搜尋股價</h3>
        <input type="text" id="stockInput" placeholder="輸入代號 (例如: 00981A)">
        <button onclick="searchStock()">查詢並加入追蹤</button>
        <p id="searchResult"></p>
    </div>

    <div class="card">
        <h3>⭐ 我的追蹤清單與提醒</h3>
        <div id="watchlist"></div>
    </div>

    <script src="./app.js"></script>
    <script>
        // 註冊 Service Worker [cite: 6]
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js')
                .then(() => console.log("Service Worker 註冊成功"))
                .catch(err => console.error("Service Worker 註冊失敗:", err));
        }
    </script>
</body>
</html>
