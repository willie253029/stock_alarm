<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台股即時追蹤 & 回檔推播</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4A90E2">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; margin: 0; padding: 20px; background-color: #f0f4f8; color: #333; }
        .container { max-width: 550px; margin: 0 auto; background: white; padding: 25px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        h1 { text-align: center; color: #2c3e50; font-size: 24px; margin-bottom: 25px; }
        .card { border: 1px solid #e2e8f0; padding: 20px; border-radius: 12px; margin-bottom: 20px; background: #fdfdfd; box-shadow: inset 0 1px 3px rgba(0,0,0,0.01); }
        h3 { margin-top: 0; color: #34495e; font-size: 16px; border-left: 4px solid #3498db; padding-left: 8px; margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 6px; font-size: 14px; color: #7f8c8d; }
        input, select { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 16px; box-sizing: border-box; transition: all 0.2s; }
        input:focus, select:focus { border-color: #3498db; outline: none; box-shadow: 0 0 0 3px rgba(52,152,219,0.2); }
        button { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        .btn-push { background-color: #4A90E2; color: white; }
        .btn-push:hover { background-color: #357ABD; }
        .btn-search { background-color: #95a5a6; color: white; margin-bottom: 15px; }
        .btn-search:hover { background-color: #7f8c8d; }
        .btn-add { background-color: #2ecc71; color: white; }
        .btn-add:hover { background-color: #27ae60; }
        .info-box { padding: 12px; background: #e8f4fd; border-radius: 8px; margin-bottom: 15px; color: #2980b9; font-size: 14px; border-left: 4px solid #2980b9; line-height: 1.5; }
        .error-box { padding: 12px; background: #fdeded; border-radius: 8px; margin-bottom: 15px; color: #c0392b; font-size: 14px; border-left: 4px solid #c0392b; }
        .loading { font-size: 14px; color: #7f8c8d; font-style: italic; text-align: center; margin-bottom: 15px; }
        .tracking-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
        .tracking-table th, .tracking-table td { padding: 12px; text-align: left; border-bottom: 1px solid #e2e8f0; }
        .tracking-table th { background-color: #f8fafc; color: #64748b; font-weight: 600; }
        .btn-delete { background-color: #e74c3c; color: white; padding: 6px 12px; font-size: 12px; border-radius: 4px; width: auto; display: inline-block; }
        .btn-delete:hover { background-color: #c0392b; }
    </style>
</head>
<body>

<div class="container">
    <h1>📈 台股抄底回檔追蹤系統</h1>
    
    <div class="card">
        <h3>🔔 步驟一：開啟通知權限</h3>
        <button class="btn-push" id="btn-subscribe">啟用雲端背景推播功能</button>
    </div>

    <div class="card">
        <h3>🔍 步驟二：設定回檔買進條件</h3>
        
        <label for="stock-code">股票代碼：</label>
        <input type="text" id="stock-code" placeholder="請輸入台股代號 (例如: 2330 或 0050)">
        
        <button id="btn-search-stock" class="btn-search">🔍 即時查詢目前股價</button>
        <div id="search-result"></div>

        <label for="period">觀測時段 (尋找此期間的歷史最高點)：</label>
        <select id="period">
            <option value="1">1 個月內</option>
            <option value="3" selected>3 個月內</option>
            <option value="6">6 個月內</option>
        </select>

        <label for="percent">回檔跌幅比例 (%)：</label>
        <input type="number" id="percent" placeholder="例如：跌破最高點 8% 時提醒" min="0.1" step="0.1">
        
        <button id="btn-add-alert" class="btn-add">➕ 加入雲端監控清單</button>
    </div>

    <div class="card">
        <h3>📊 目前雲端監控中的清單</h3>
        <div id="tracking-list">
            </div>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
